[project]
name = "arribo-backend"
version = "0.1.0"
description = "Arribo: gestión de servicios de grúa (backend y panel web)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",              # LTS, con soporte hasta abril de 2028
    "djangorestframework>=3.18,<3.19",
    "psycopg[binary]>=3.3,<3.4",
    "dj-database-url>=2",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.14",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
