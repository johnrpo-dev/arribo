<form method="get" action="{% url 'solicitudes' %}" class="buscador" role="search">
  {% if filtro %}<input type="hidden" name="filtro" value="{{ filtro }}">{% endif %}
  <label class="oculto" for="buscar-solicitud">Buscar solicitud</label>
  <div class="buscador-fila">
    <input type="search" id="buscar-solicitud" name="q" value="{{ texto|default:'' }}" placeholder="Buscar solicitud" aria-describedby="buscar-solicitud-ayuda">
    <button type="submit" class="boton boton--secundario">Buscar</button>
  </div>
  <p class="ayuda" id="buscar-solicitud-ayuda">Teléfono o nombre del cliente, placa, VIN, número de solicitud o de caso, conductor, placa de la grúa, número de factura o fecha (18/11/2026).</p>
</form>
